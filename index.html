<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'an</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-neutral-50 text-neutral-900 min-h-screen" x-data="beranda()" x-cloak>

    <!-- ===== Header ===== -->
    <header class="sticky top-0 z-40 bg-emerald-800 text-white shadow">
        <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
            <!-- Tombol menu (sidebar) -->
            <button @click="sidebar = true" aria-label="Buka menu"
                    class="rounded-full p-2 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>

            <h1 class="text-lg font-semibold tracking-wide">Al-Qur'an</h1>

            <!-- Tombol pencarian -->
            <button @click="cari = true" aria-label="Cari"
                    class="rounded-full p-2 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- ===== Sidebar ===== -->
    <div class="fixed inset-0 z-50" x-show="sidebar" x-transition.opacity>
        <div class="absolute inset-0 bg-black/50" @click="sidebar = false"></div>
        <aside class="absolute left-0 top-0 h-full w-72 max-w-[80%] bg-white shadow-xl p-4"
               x-transition:enter="transition ease-out duration-200"
               x-transition:enter-start="-translate-x-full"
               x-transition:enter-end="translate-x-0"
               x-transition:leave="transition ease-in duration-150"
               x-transition:leave-start="translate-x-0"
               x-transition:leave-end="-translate-x-full">
            <div class="mb-4 flex items-center justify-between">
                <span class="text-lg font-bold text-emerald-800">Menu</span>
                <button @click="sidebar = false" aria-label="Tutup menu" class="rounded-full p-1 hover:bg-neutral-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <nav class="space-y-1">
                <a href="#terakhir"   @click="sidebar = false" class="block rounded-lg px-3 py-2 hover:bg-emerald-50">Terakhir Dibaca</a>
                <a href="#akses"      @click="sidebar = false" class="block rounded-lg px-3 py-2 hover:bg-emerald-50">Akses Ayat</a>
                <a href="read.html?surah=1&ayat=1" class="block rounded-lg px-3 py-2 hover:bg-emerald-50">Mulai Baca</a>
            </nav>
        </aside>
    </div>

    <!-- ===== Modal Pencarian ===== -->
    <div class="fixed inset-0 z-50 flex items-start justify-center p-4 pt-20" x-show="cari" x-transition.opacity>
        <div class="absolute inset-0 bg-black/50" @click="cari = false"></div>
        <div class="relative w-full max-w-md rounded-xl bg-white shadow-xl"
             @keydown.escape.window="cari = false">
            <div class="flex items-center gap-2 border-b border-neutral-200 px-4 py-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-neutral-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/>
                </svg>
                <input x-model="q" type="search" placeholder="Cari surah…"
                       class="w-full outline-none" autofocus>
            </div>
            <ul class="max-h-72 overflow-y-auto py-2">
                <template x-for="s in hasilCari" :key="s.nomor">
                    <li>
                        <a :href="'read.html?surah=' + s.nomor" class="flex items-center justify-between px-4 py-2 hover:bg-emerald-50">
                            <span>
                                <span class="font-medium" x-text="s.namaLatin"></span>
                                <span class="text-sm text-neutral-500" x-text="' — ' + s.arti"></span>
                            </span>
                            <span class="text-sm text-neutral-400" x-text="s.ayat + ' ayat'"></span>
                        </a>
                    </li>
                </template>
                <li x-show="hasilCari.length === 0" class="px-4 py-6 text-center text-sm text-neutral-500">
                    Tidak ada hasil.
                </li>
            </ul>
        </div>
    </div>

    <main class="mx-auto max-w-3xl px-4 pb-12">

        <!-- ===== Terakhir Dibaca ===== -->
        <section id="terakhir" class="mt-6">
            <h2 class="mb-3 text-base font-semibold text-neutral-700">Terakhir Dibaca</h2>
            <div class="grid grid-cols-2 gap-3">
                <!-- Slot 1 -->
                <a x-show="lastRead" :href="lastRead ? 'read.html?surah=' + lastRead.surah + '&ayat=' + lastRead.ayat : '#'"
                   class="rounded-xl border border-neutral-200 bg-white p-4 shadow-sm transition hover:shadow-md">
                    <p class="text-sm font-semibold text-emerald-800" x-text="lastRead ? ('QS. ' + namaSurah(lastRead.surah)) : ''"></p>
                    <p class="mt-1 text-xs text-neutral-500" x-text="lastRead ? (lastRead.surah + ':' + lastRead.ayat) : ''"></p>
                </a>
                <!-- Slot 2 -->
                <a x-show="prevRead" :href="prevRead ? 'read.html?surah=' + prevRead.surah + '&ayat=' + prevRead.ayat : '#'"
                   class="rounded-xl border border-neutral-200 bg-white p-4 shadow-sm transition hover:shadow-md">
                    <p class="text-sm font-semibold text-emerald-800" x-text="prevRead ? ('QS. ' + namaSurah(prevRead.surah)) : ''"></p>
                    <p class="mt-1 text-xs text-neutral-500" x-text="prevRead ? (prevRead.surah + ':' + prevRead.ayat) : ''"></p>
                </a>
                <!-- Placeholder jika belum ada riwayat -->
                <div x-show="!lastRead" class="col-span-2 rounded-xl border border-dashed border-neutral-300 bg-white/50 p-4 text-center text-sm text-neutral-500">
                    Belum ada riwayat bacaan. Mulai baca dari <a href="read.html?surah=1&ayat=1" class="text-emerald-700 underline">Al-Fatihah</a>.
                </div>
            </div>
        </section>

        <!-- ===== Akses Ayat ===== -->
        <section id="akses" class="mt-8">
            <h2 class="mb-3 text-base font-semibold text-neutral-700">Akses Ayat</h2>
            <form @submit.prevent="goToAyat()" class="flex items-end gap-3 rounded-xl border border-neutral-200 bg-white p-4 shadow-sm">
                <div class="flex-1">
                    <label for="sel-surah" class="mb-1 block text-xs font-medium text-neutral-500">Surah</label>
                    <select id="sel-surah" x-model.number="pilihSurah"
                            class="w-full rounded-lg border border-neutral-300 bg-white px-3 py-2 text-sm focus:border-emerald-600 focus:outline-none">
                        <option value="" disabled>Pilih surah…</option>
                        <template x-for="s in surahList" :key="s.nomor">
                            <option :value="s.nomor" x-text="s.nomor + '. ' + s.namaLatin"></option>
                        </template>
                    </select>
                </div>
                <div class="w-24">
                    <label for="inp-ayat" class="mb-1 block text-xs font-medium text-neutral-500">Ayat</label>
                    <input id="inp-ayat" x-model.number="pilihAyat" type="number" min="1"
                           :max="maxAyat"
                           class="w-full rounded-lg border border-neutral-300 px-3 py-2 text-sm focus:border-emerald-600 focus:outline-none">
                </div>
                <button type="submit"
                        class="rounded-lg bg-emerald-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-emerald-800 disabled:opacity-40"
                        :disabled="!pilihSurah || !pilihAyat">
                    Baca
                </button>
            </form>
            <p class="mt-2 text-xs text-neutral-400">
                Contoh format tautan: <code>read.html?surah=2&amp;ayat=255</code> (Al-Baqarah ayat 255).
            </p>
        </section>

    </main>

    <script>
        // Daftar 114 surah: [nomor, namaLatin, arti, jumlahAyat]
        const SURAH_DATA = [
            [1,"Al-Fatihah","Pembukaan",7],[2,"Al-Baqarah","Sapi Betina",286],[3,"Ali 'Imran","Keluarga Imran",200],
            [4,"An-Nisa","Wanita",176],[5,"Al-Ma'idah","Hidangan",120],[6,"Al-An'am","Binatang Ternak",165],
            [7,"Al-A'raf","Tempat Tertinggi",206],[8,"Al-Anfal","Harta Rampasan Perang",75],[9,"At-Taubah","Pengampunan",129],
            [10,"Yunus","Nabi Yunus",109],[11,"Hud","Nabi Hud",123],[12,"Yusuf","Nabi Yusuf",111],
            [13,"Ar-Ra'd","Guruh",43],[14,"Ibrahim","Nabi Ibrahim",52],[15,"Al-Hijr","Gunung Hijr",99],
            [16,"An-Nahl","Lebah",128],[17,"Al-Isra'","Perjalanan Malam",111],[18,"Al-Kahf","Gua",110],
            [19,"Maryam","Maryam",98],[20,"Taha","Ta Ha",135],[21,"Al-Anbiya","Para Nabi",112],
            [22,"Al-Hajj","Haji",78],[23,"Al-Mu'minun","Orang-orang Mukmin",118],[24,"An-Nur","Cahaya",64],
            [25,"Al-Furqan","Pembeda",77],[26,"Asy-Syu'ara","Para Penyair",227],[27,"An-Naml","Semut",93],
            [28,"Al-Qasas","Kisah-kisah",88],[29,"Al-'Ankabut","Laba-laba",69],[30,"Ar-Rum","Bangsa Romawi",60],
            [31,"Luqman","Luqman",34],[32,"As-Sajdah","Sujud",30],[33,"Al-Ahzab","Golongan yang Bersekutu",73],
            [34,"Saba'","Kaum Saba'",54],[35,"Fatir","Pencipta",45],[36,"Yasin","Yasin",83],
            [37,"As-Saffat","Barisan-barisan",182],[38,"Sad","Ṣād",88],[39,"Az-Zumar","Rombongan",75],
            [40,"Gafir","Yang Mengampuni",85],[41,"Fussilat","Yang Dijelaskan",54],[42,"Asy-Syura","Musyawarah",53],
            [43,"Az-Zukhruf","Perhiasan",89],[44,"Ad-Dukhan","Kabut",59],[45,"Al-Jasiyah","Yang Berjongkok",37],
            [46,"Al-Ahqaf","Bukit Pasir",35],[47,"Muhammad","Nabi Muhammad",38],[48,"Al-Fath","Kemenangan",29],
            [49,"Al-Hujurat","Kamar-kamar",18],[50,"Qaf","Qāf",45],[51,"Adz-Dzariyat","Angin yang Menerbangkan",60],
            [52,"Ath-Thur","Bukit Tursina",49],[53,"An-Najm","Bintang",62],[54,"Al-Qamar","Bulan",55],
            [55,"Ar-Rahman","Yang Maha Pengasih",78],[56,"Al-Waqi'ah","Hari Kiamat",96],[57,"Al-Hadid","Besi",29],
            [58,"Al-Mujadalah","Perempuan yang Mengajukan Gugatan",22],[59,"Al-Hasyr","Pengusiran",24],[60,"Al-Mumtahanah","Perempuan yang Diuji",13],
            [61,"As-Saff","Barisan",14],[62,"Al-Jumu'ah","Hari Jumat",11],[63,"Al-Munafiqun","Orang-orang Munafik",11],
            [64,"At-Tagabun","Hari Ditampakkan Kesalahan",18],[65,"Ath-Thalaq","Talak",12],[66,"At-Tahrim","Pengharaman",12],
            [67,"Al-Mulk","Kerajaan",30],[68,"Al-Qalam","Pena",52],[69,"Al-Haqqah","Hari Berbuat Baik",52],
            [70,"Al-Ma'arij","Tempat Naik",44],[71,"Nuh","Nabi Nuh",28],[72,"Al-Jinn","Jin",28],
            [73,"Al-Muzzammil","Orang yang Berselimut",20],[74,"Al-Muddassir","Orang yang Berkemul",56],[75,"Al-Qiyamah","Hari Kiamat",40],
            [76,"Al-Insan","Manusia",31],[77,"Al-Mursalat","Malaikat yang Diutus",50],[78,"An-Naba'","Berita Besar",40],
            [79,"An-Nazi'at","Malaikat yang Mencabut",46],[80,'Abasa',"Muka Masam",42],[81,"At-Takwir","Gulundungnya Matahari",29],
            [82,"Al-Infitar","Terbelahnya Langit",19],[83,"Al-Mutaffifin","Orang yang Curang",36],[84,"Al-Insyiqaq","Terbelahnya Langit",25],
            [85,"Al-Buruj","Gugusan Bintang",22],[86,"Ath-Thariq","Yang Datang di Malam Hari",17],[87,"Al-A'la","Yang Paling Tinggi",19],
            [88,"Al-Gasyiyah","Hari Pembalasan",26],[89,"Al-Fajr","Fajar",30],[90,"Al-Balad","Negeri",20],
            [91,"Asy-Syams","Matahari",15],[92,"Al-Lail","Malam",21],[93,"Ad-Duha","Time After Sunrise",11],
            [94,"Asy-Syarh","Kelapangan",8],[95,"At-Tin","Buah Tin",8],[96,"Al-'Alaq","Segumpal Darah",19],
            [97,"Al-Qadr","Kemuliaan",5],[98,"Al-Bayyinah","Bukti Nyata",8],[99,"Az-Zalzalah","Kegoncangan",8],
            [100,"Al-'Adiyat","Kuda Perang",11],[101,"Al-Qari'ah","Hari Kiamat",11],[102,"At-Takasur"," Bermegah-megahan",8],
            [103,"Al-'Asr","Masa",3],[104,"Al-Humazah","Pengumpat",9],[105,"Al-Fil","Gajah",5],
            [106,"Quraisy","Suku Quraisy",4],[107,"Al-Ma'un","Barang Berguna",7],[108,"Al-Kausar","Nikmat Berlimpah",3],
            [109,"Al-Kafirun","Orang-orang Kafir",6],[110,"An-Nasr","Pertolongan",3],[111,"Al-Lahab","Gejolak Api",5],
            [112,"Al-Ikhlas","Eksistensi Allah",4],[113,"Al-Falaq","Waktu Subuh",5],[114,"An-Nas","Manusia",6]
        ];

        function beranda() {
            return {
                sidebar: false,
                cari: false,
                q: '',
                surahList: SURAH_DATA.map(([nomor, namaLatin, arti, ayat]) => ({ nomor, namaLatin, arti, ayat })),
                pilihSurah: '',
                pilihAyat: 1,
                lastRead: null,
                prevRead: null,

                init() {
                    try {
                        const raw = localStorage.getItem('lastRead');
                        if (raw) {
                            const data = JSON.parse(raw);
                            // data dapat berupa array riwayat atau objek tunggal
                            if (Array.isArray(data)) {
                                this.lastRead = data[0] || null;
                                this.prevRead = data[1] || null;
                            } else {
                                this.lastRead = data;
                            }
                        }
                    } catch (e) { /* abaikan riwayat rusak */ }
                },

                get maxAyat() {
                    const s = this.surahList.find(x => x.nomor === Number(this.pilihSurah));
                    return s ? s.ayat : 6236;
                },

                get hasilCari() {
                    const k = this.q.trim().toLowerCase();
                    if (!k) return this.surahList.slice(0, 10);
                    return this.surahList.filter(s =>
                        s.namaLatin.toLowerCase().includes(k) || s.arti.toLowerCase().includes(k)
                    );
                },

                namaSurah(nomor) {
                    const s = this.surahList.find(x => x.nomor === Number(nomor));
                    return s ? s.namaLatin : 'Surah ' + nomor;
                },

                goToAyat() {
                    const n = Number(this.pilihSurah), a = Number(this.pilihAyat);
                    if (!n || !a) return;
                    window.location.href = 'read.html?surah=' + n + '&ayat=' + Math.max(1, a);
                }
            };
        }
    </script>
</body>
</html>
